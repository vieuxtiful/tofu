name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # ─── build Python wheel + sdist ──────────────────────────────────────
  build-python:
    name: Build Python wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify metadata
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  # ─── build frontend production bundle ────────────────────────────────
  build-frontend:
    name: Build frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  # ─── build and push Docker images to GHCR ────────────────────────────
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [build-python, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set tag variable
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tofu-app:latest
            ghcr.io/${{ github.repository_owner }}/tofu-app:${{ steps.tag.outputs.version }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tofu-frontend:latest
            ghcr.io/${{ github.repository_owner }}/tofu-frontend:${{ steps.tag.outputs.version }}

      - name: Build and push paddle image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.paddle
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tofu-paddle:latest
            ghcr.io/${{ github.repository_owner }}/tofu-paddle:${{ steps.tag.outputs.version }}

      - name: Build and push inpaint image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.inpaint
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tofu-inpaint:latest
            ghcr.io/${{ github.repository_owner }}/tofu-inpaint:${{ steps.tag.outputs.version }}

  # ─── create GitHub Release ───────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-python, build-frontend, build-docker]
    steps:
      - uses: actions/checkout@v4

      - name: Set tag variable
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
            echo "ref=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "ref=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download Python dist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Zip frontend dist
        run: tar -czf dist/tofu-frontend-${{ steps.tag.outputs.version }}.tar.gz -C frontend-dist .

      - name: Extract changelog entry
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION="${{ steps.tag.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          # Try to find the version heading (with or without v prefix)
          awk -v v="$VERSION" -v vn="$VERSION_NO_V" '
            /^## \[/ {
              if (found) exit
              if (index($0, v) || index($0, vn)) found=1
            }
            found { print }
          ' CHANGELOG.md > /tmp/changelog-entry.md
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog-entry.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          name: ${{ steps.tag.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

  # ─── publish to PyPI (optional, requires PYPI_API_TOKEN secret) ──────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.event_name == 'push'
    steps:
      - name: Check for PyPI token
        id: has_token
        env:
          HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: echo "ok=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.has_token.outputs.ok == 'true'
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        if: steps.has_token.outputs.ok == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload dist/*.whl dist/*.tar.gz
