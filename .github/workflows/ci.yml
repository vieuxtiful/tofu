## 🍢 ToFU — continuous integration
## vieuxtiful
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

## NOTE ON TEST COVERAGE IN CI
## `tests/` is gitignored deliberately -- the backend suite is local-only and
## is not published to the remote. CI therefore CANNOT run it, and the job
## below no longer pretends to: it previously ran `pytest tests/ -q` against a
## path that does not exist on a runner, which passed or failed for reasons
## unrelated to the project.
##
## What replaces it:
##   - here: an import/smoke matrix that is real on a clean clone
##   - locally: `python scripts/record_test_evidence.py`, which runs the true
##     suite and writes evidence/test-run.json -- the artifact IS published,
##     the tests are not.
## See docs/output-dependability-roadmap.md, P0.2.

jobs:
  smoke:
    name: import & smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
        include:
          # older interpreters on Linux only -- the point is to catch syntax
          # and stdlib drift, not to re-run the whole matrix twice over
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install (CPU torch)
        # The CPU wheel index keeps this a ~200 MB install instead of the
        # ~2.5 GB CUDA default. Runners have no GPU, so the CUDA build would
        # be dead weight that also blows the disk quota.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[all,dev]"

      - name: Fonts for shaping (Linux)
        # Scribe resolves a fallback face at import time and the smoke check
        # exercises that path, so a runner with no CJK/Indic faces reports a
        # different degradation than a real host. Supplying Noto keeps the
        # smoke result representative.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core fonts-noto-core fonts-liberation

      - name: Import & smoke checks
        env:
          PYTHONUTF8: "1"   # EasyOCR's progress bar dies on a cp1252 console
        run: python scripts/ci_smoke.py

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # ruff is not in any project extra (dev only pulls pytest) -- install it
      # directly. No source install needed: ruff parses files, it does not import.
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      # `tests/` is intentionally absent from the remote (see the note at the
      # top of this file), so linting it here can only ever error on a missing
      # path. The local suite is linted by the same rules via pyproject when
      # run locally.
      #
      # KNOWN RED, measured 2026-08-10: `ruff check src/ server/` reports 2757
      # errors (2393 auto-fixable, overwhelmingly UP006/UP035 typing-import
      # modernisation) and `ruff format --check` would reformat 56 of 64 files.
      # This job has therefore never passed. That is a real backlog, not a
      # configuration accident, and clearing it is a mechanical but large diff
      # that deserves its own review -- it is tracked as P2.15 in
      # docs/output-dependability-roadmap.md.
      #
      # `continue-on-error` keeps the finding VISIBLE (the step reports red)
      # without blocking every other job behind a pre-existing backlog. Remove
      # it in the same change that clears the backlog -- not before, and not by
      # narrowing the paths.
      - name: ruff check
        continue-on-error: true
        run: ruff check src/ server/ scripts/

      - name: ruff format --check
        continue-on-error: true
        run: ruff format --check src/ server/

  typecheck:
    name: typecheck (mypy + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # mypy is not in any project extra. MYPYPATH=src mirrors pytest's
      # pythonpath so mypy resolves the src-layout package without a full
      # install; ignore_missing_imports (set in pyproject) covers cv2/easyocr.
      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy

      - name: mypy src/tofu
        env:
          MYPYPATH: "src"
        run: mypy src/tofu

      - name: Install server deps for API doc generation
        run: |
          python -m pip install -e ".[server]"

      - name: Verify API docs are up to date
        # Regenerate docs/api.md and check it matches the committed version.
        # If this fails, run `python scripts/generate_api_docs.py` and commit.
        run: |
          python scripts/generate_api_docs.py --output /tmp/api-check.md
          diff docs/api.md /tmp/api-check.md || \
          echo "::warning::docs/api.md is stale. Run: python scripts/generate_api_docs.py"

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: tsc --noEmit
        run: npx tsc --noEmit
        working-directory: frontend

  frontend-test:
    name: frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Run vitest
        run: npm test
        working-directory: frontend

  build:
    name: build (server + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build server (editable install)
        # The [server] extra pulls fastapi/uvicorn/pydantic without the OCR
        # torch stack -- enough to prove the app imports and builds clean.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server]"

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  package:
    name: wheel builds and installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Clean-room install
        # The acceptance test for packaging: install the built wheel into a
        # FRESH venv and import it with no PYTHONPATH and no source tree on
        # sys.path. tests/conftest.py injects src/ during normal test runs,
        # which would otherwise mask a broken package layout entirely.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --quiet dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "
          import tofu
          assert tofu.__version__, 'version missing'
          from tofu import BBox, TextManifest, StyleProfil
          from tofu.utils import interchange
          m = TextManifest(asset_id='a', total_regions=0, src_lang='en', instances=[])
          assert 'tool-version=\"%s\"' % tofu.__version__ in interchange.export_xliff(m, 'en', 'es')
          print('clean-room import OK, version', tofu.__version__)
          "

      - name: py.typed ships in the wheel
        run: |
          python -c "
          import zipfile, glob
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          assert 'tofu/py.typed' in names, 'py.typed missing from wheel: %s' % names[:20]
          print('py.typed present')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
